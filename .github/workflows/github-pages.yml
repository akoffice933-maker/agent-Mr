# Публикует статическую витрину лендинга (demo/) на GitHub Pages.
#
# Содержимое demo/ генерируется из НАСТОЯЩИХ страниц приложения, а не пишется
# руками: `npx next build && npx next start -p 3200`, затем
# `node scripts/export-landing.mjs`. Так витрина не расходится с продуктом —
# цены, список команд агента и тексты берутся из того же кода.
#
# Pages settings: Source = GitHub Actions.

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
