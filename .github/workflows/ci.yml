# CI for the main Next.js application: lint + typecheck + unit tests + production build.
# Runs on every push/PR to main. The demo site (demo/) is deployed separately
# by github-pages.yml.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "demo/**"
      - "docs/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply schema + RLS to CI database
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm run migrate && psql "$DATABASE_URL" -f docs/rls_multi_tenant.sql

      - name: RLS audit (regression guard — must stay green)
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx tsx scripts/rls-audit.ts

      - name: Unit + integration tests (real Postgres — no more skipped DB tests)
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DATABASE_TEST_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          ENCRYPTION_KEY: ci-only-encryption-key-32-chars-min
        run: npm run test

      - name: Production build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          ENCRYPTION_KEY: ci-only-encryption-key-32-chars-min
        run: npm run build

  clients:
    # mcp-server and telegram-bot are separate packages with their own lockfiles.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: MCP server — install & typecheck
        working-directory: mcp-server
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Telegram bot — install & typecheck
        working-directory: telegram-bot
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
