# CI for the main Next.js application: lint + typecheck + unit tests + production build.
# Runs on every push/PR to main. The demo site (demo/) is deployed separately
# by github-pages.yml.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "demo/**"
      - "docs/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Real Postgres so the tenant-security integration tests (RLS audit,
      # fail-closed, no context leak) actually run in CI — the category of
      # regression that used to slip through when they were skipped.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://appuser:apppass@127.0.0.1:5432/app_db
      DATABASE_TEST_URL: postgresql://appuser:apppass@127.0.0.1:5432/app_db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # appuser must NOT be a superuser: superusers bypass RLS even with
      # FORCE, which would silently disable the tenant isolation under test.
      - name: Create non-superuser app role + database
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" <<'SQL'
            CREATE ROLE appuser LOGIN PASSWORD 'apppass';
            CREATE DATABASE app_db OWNER appuser;
          SQL

      - name: Apply migrations
        run: npm run migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: RLS audit (live DB)
        run: npm run audit:rls

      - name: Test suite (unit + integration, against real Postgres)
        run: npm run test

      - name: Production build
        env:
          ENCRYPTION_KEY: ci-only-encryption-key
        run: npm run build

      # Review P2: nothing failed the build on a known-vulnerable dependency,
      # so advisories were only ever noticed by running `npm audit` by hand.
      # Production dependencies only — a dev-only advisory should not block a
      # release, and is surfaced by the Dependabot config instead.
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  clients:
    # mcp-server and telegram-bot are separate packages with their own lockfiles.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: MCP server — install & typecheck
        working-directory: mcp-server
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Telegram bot — install & typecheck
        working-directory: telegram-bot
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
