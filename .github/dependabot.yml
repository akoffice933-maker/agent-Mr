# Review P2: there was no automated dependency surveillance at all — advisories
# were found only when someone ran `npm audit` by hand. CI now fails on a
# high/critical production advisory; Dependabot is the other half, opening PRs
# so upgrades are routine rather than an emergency.
#
# Three separate npm ecosystems live in this repo (each with its own lockfile),
# plus the GitHub Actions used by the workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Пакет, опубликованный час назад, может оказаться скомпрометированным
    # (типовой сценарий: угон учётки мейнтейнера и релиз с вредоносным
    # postinstall). Неделя выдержки — время, за которое такие релизы
    # обычно отзывают, и обновление не попадает в PR автоматически.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Patch/minor bumps land as ONE PR to keep the review queue small;
      # majors stay separate because they need real attention.
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: "/telegram-bot"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "telegram-bot"]

  - package-ecosystem: npm
    directory: "/mcp-server"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "mcp-server"]

  # Pinned action versions also go stale (and are a supply-chain surface).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
